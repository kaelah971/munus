services:
  - type: web
    name: munus-public-beta
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run server:start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_MUNUS_API_BASE_URL
        value: ""
      - key: VITE_MUNUS_LOCAL_AUTH
        value: "false"
      - key: VITE_MUNUS_PRODUCTION_AUTH
        value: "true"
      - key: VITE_MUNUS_SESSION_MODE
        value: remote
      - key: MUNUS_COOKIE_SECURE
        value: "true"
      - key: MUNUS_COOKIE_NAME
        value: munus_session
      - key: MUNUS_CHALLENGE_TTL_SECONDS
        value: "300"
      - key: MUNUS_SESSION_TTL_SECONDS
        value: "2592000"
      - key: MUNUS_NIMIQ_NETWORK
        value: mainnet
      - key: DATABASE_URL
        sync: false
